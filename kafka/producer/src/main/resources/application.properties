# Define o nome da aplicacao Spring Boot
spring.application.name=producer

# Define em qual porta o servidor HTTP vai rodar
server.port=8081

# O Whitelabel Error Page e a pagina padrao de erro do Spring Boot
server.error.whitelabel.enabled=false

# Propriedade que informa onde esta o broker Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Ativa o log do Kafka para debug
logging.level.org.apache.kafka=DEBUG
