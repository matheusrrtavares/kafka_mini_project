#Define o nome da aplicação Spring Boot
spring.application.name=producer

#Define em qual porta o servidor http vai roder
server.port=8081

#O Whitelabel Error Page é a página padrão de erro do Spring Boot
server.error.whitelabel.enabled=false

#Essa é a propriedade mais importante para o kafka
#
#Ela informa onde está o broker Kafka
#Significa
#Parte          Significado
#localhost      Kafka está na sua máquina
#9092           porta do broker
spring.kafka.bootstrap-servers=localhost:9092

#Ativa o log kafka para debug
logging.level.org.apache.kafka=DEBUG